spring.application.name=ilikepho
spring.datasource.url=jdbc:postgresql://localhost:5432/ilikepho
spring.datasource.username=postgres
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

# Cookie phiên admin: Secure bật khi production chạy HTTPS, tắt khi dev chạy HTTP
admin.session.cookie.secure=false

# Phiên admin: số phút không hoạt động tối đa trước khi hết hạn (sliding expiration)
admin.session.timeout-minutes=30

# Ghi nhớ đăng nhập admin: số ngày sống của cookie ADMIN_REMEMBER và hạn dùng token trong DB
admin.remember-me.max-age-days=30

# Job dọn remember token hết hạn: cron (múi giờ job khai báo Asia/Ho_Chi_Minh tại @Scheduled), mặc định 3h sáng
admin.remember-me.cleanup-cron=0 0 3 * * *

# Chống login-CSRF cho form đăng nhập: số phút sống của cookie ADMIN_LOGIN_CSRF
admin.login-csrf.max-age-minutes=30

# Seed tài khoản admin chỉ dùng dev/local: bật bằng biến môi trường khi cần kiểm chứng,
# mặc định tắt và mật khẩu seed để rỗng (không bao giờ commit mật khẩu thật)
admin.seed.enabled=false
admin.seed.username=admin
admin.seed.password=