# ===== Cấu hình production (bật bằng SPRING_PROFILES_ACTIVE=prod) =====
# Yêu cầu vận hành: app chạy HTTPS phía sau reverse proxy (nginx) và proxy phải set đúng header X-Forwarded-*.

# Cookie phiên ADMIN_SESSION và cookie ghi nhớ ADMIN_REMEMBER bật Secure (production chạy HTTPS)
admin.session.cookie.secure=true

# Đọc scheme/port/host từ header reverse proxy (X-Forwarded-Proto/Host/Port) để redirect giữ đúng HTTPS
server.forward-headers-strategy=framework

# Production không log SQL (tránh đưa dữ liệu vào log) và bật cache template Thymeleaf
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
