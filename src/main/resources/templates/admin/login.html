<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragment/head :: head-common}"></th:block>
    <title>Đăng nhập | Tiệm Phở cô Dự</title>
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body>
<main class="login-page">

    <!-- ===== Mảng tối: tĩnh vật nước dùng ===== -->
    <section class="scene">
        <span class="scene-seal" aria-hidden="true">Tiệm Phở cô Dự</span>

        <div class="scene-lockup">
            <span class="brand-badge" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 10c0-4 3-6 3-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                    <path d="M28 10c0-4 3-6 3-6" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
                    <path d="M11 25a13 13 0 0 0 26 0z" fill="#fff" opacity=".95"/>
                    <path d="M11 25a13 4 0 0 1 26 0" fill="#ffd97a"/>
                    <path d="M17 24q3 4 6 0t6 0t6 0" stroke="#e2722b" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
            </span>
            <div class="lockup-text">
                <h1 class="scene-title">Tiệm Phở cô Dự</h1>
                <p class="scene-sub">Đăng nhập quản trị</p>
            </div>
        </div>

        <div class="scene-still" aria-hidden="true">
            <span class="steam s1"></span>
            <span class="steam s2"></span>
            <span class="steam s3"></span>
            <svg class="bowl" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M45 100a75 46 0 0 0 150 0z" fill="#fff3e0" stroke="#dfc19b" stroke-width="3"/>
                <ellipse cx="120" cy="100" rx="75" ry="27" fill="#fffaf2" stroke="#dfc19b" stroke-width="3"/>
                <ellipse cx="120" cy="103" rx="62" ry="19" fill="#dca03c"/>
                <path d="M76 98q10 10 20 0t20 0t20 0t20 0" stroke="#f5d387" stroke-width="6" stroke-linecap="round"/>
                <path d="M82 107q10 10 20 0t20 0t20 0t20 0" stroke="#f5d387" stroke-width="6" stroke-linecap="round" opacity=".7"/>
                <ellipse cx="98" cy="99" rx="15" ry="8" fill="#e76f51"/>
                <ellipse cx="142" cy="102" rx="12" ry="7" fill="#e76f51" opacity=".85"/>
                <path d="M116 88q4-12 10-16" stroke="#8fbd72" stroke-width="5" stroke-linecap="round"/>
                <path d="M126 90q4-12 10-16" stroke="#8fbd72" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>

        <p class="scene-caption" aria-hidden="true">Hà Nội · 30 năm hương vị</p>
    </section>

    <!-- ===== Mảng sáng: form đăng nhập ===== -->
    <section class="login-side">
        <div class="login-card">
            <header class="brand">
                <span class="brand-badge" aria-hidden="true">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 10c0-4 3-6 3-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                        <path d="M28 10c0-4 3-6 3-6" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
                        <path d="M11 25a13 13 0 0 0 26 0z" fill="#fff" opacity=".95"/>
                        <path d="M11 25a13 4 0 0 1 26 0" fill="#ffd97a"/>
                        <path d="M17 24q3 4 6 0t6 0t6 0" stroke="#e2722b" stroke-width="2.4" stroke-linecap="round"/>
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Tiệm Phở cô Dự</h1>
                    <p>Đăng nhập quản trị</p>
                </div>
            </header>
            <span class="brand-rule" aria-hidden="true"></span>

            <!-- Hiển thị khi đăng nhập sai: /admin/login?error (chuẩn Spring Security) -->
            <div class="alert alert-error" th:if="${param.error}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4"/>
                    <path d="M12 16h.01"/>
                </svg>
                <span>Tài khoản hoặc mật khẩu không đúng. Vui lòng thử lại.</span>
            </div>

            <form class="login-form" data-login-form th:action="@{/admin/login}" th:object="${userLogin}" method="post">
                <div class="field">
                    <label for="username">Tài khoản</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
                        </svg>
                        <input type="text" id="username" name="username" th:field="*{userName}"
                               th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'"
                               placeholder="Nhập tài khoản" autocomplete="username">
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></p>
                </div>

                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="5" y="11" width="14" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" th:field="*{userPassword}"
                               th:classappend="${#fields.hasErrors('userPassword')} ? 'is-invalid'"
                               placeholder="Nhập mật khẩu" autocomplete="current-password">
                        <button type="button" class="trailing" data-toggle-password aria-label="Hiện mật khẩu" aria-pressed="false" tabindex="-1">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <p class="field-error" th:if="${#fields.hasErrors('userPassword')}" th:text="${#fields.errors('userPassword')[0]}"></p>
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe" name="rememberMe" th:field="*{rememberMe}" value="true">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-login">Đăng nhập</button>
            </form>
        </div>
    </section>
</main>

<script th:src="@{/js/admin-login.js}" src="/js/admin-login.js"></script>
</body>
</html>
